[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kiran-ai"
version = "0.2.0a11"
description = "KiranAI: standalone local conversation and experimental typed decision models"
authors = [
    { name = "S Kiran" }
]
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.20.0",
    "textual>=8.1.1,<9",
    "rich>=14.2.0,<15",
    "pillow>=9.0.0",
    "psutil>=5.9,<8",
]

keywords = ["ai", "transformer", "slm", "small-language-model", "decision-engine", "edge-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/skiran/KiranAI"
Issues = "https://github.com/skiran/KiranAI/issues"

[project.optional-dependencies]
local = [
    "llama-cpp-python>=0.2.90",
]
desktop = [
    "mss>=9.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
]
ocr = [
    "easyocr>=1.7.2",
]

[project.scripts]
kiran = "kiran_ai.cli.main:main"
hari = "kiran_ai.cli.main:main"

[tool.setuptools.packages.find]
include = ["kiran_ai*"]

[tool.setuptools.package-data]
kiran_ai = ["assets/*.gguf", "assets/*.pt", "assets/*.json", "assets/*.md", "assets/*.png", "assets/LICENSE*", "vendor/open_jev/LICENSE", "vendor/open_jev/NOTICE.md"]
"kiran_ai.cli" = ["*.tcss"]

