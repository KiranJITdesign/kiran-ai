name: KiranAI CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test on Windows (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install torch numpy textual rich pillow psutil
        pip install -e .

    - name: Run Complete Test Suite
      run: |
        python -m unittest discover tests

    - name: Verify CLI Execution
      run: |
        python -m kiran_ai.cli info
        python -m kiran_ai.cli version
        python -m kiran_ai.cli decide "Test verification"
